    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4a57'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%238dcec0'/%3E%3Cpath d='M7 16h18M16 6v20' stroke='%23fff5dc' stroke-width='2'/%3E%3C/svg%3E" />

      body { background:radial-gradient(circle at 13% 18%,#fff8e5 0 7%,transparent 29%), radial-gradient(circle at 86% 16%,#c8f0e5 0,transparent 37%), linear-gradient(135deg,#a6e2d4,#77cbbb); color:var(--ink); font-family:'DM Mono',monospace; }

      .tooltip::after { content:''; position:absolute; left:50%; bottom:-5px; width:10px; height:10px; background:#174451; transform:translateX(-50%) rotate(45deg); }
      @media (max-width:700px) { header { height:78px; padding:0 20px; } .brand{gap:12px}.brand-title{font-size:30px}.brand-caption{display:none} }

  <body>
    <header>
      <div class="brand"><h1 class="brand-title"><span class="brand-kicker">Pocket</span> Atlas</h1><span class="brand-caption"><span data-i18n="taglineTop">A PERSONAL</span><br><span data-i18n="taglineBottom">TRAVEL JOURNAL</span></span></div>
      <nav aria-label="Main menu" data-i18n-label="mainMenu">
        <button type="button" class="nav-icon" data-places data-i18n-label="travelIndex" data-i18n-hint="travelIndex" aria-label="Travel index">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 10c0 4.3-6 10-6 10S6 14.3 6 10a6 6 0 1 1 12 0Z"/><circle cx="12" cy="10" r="2"/><path d="M5 19.5 3 21h18l-2-1.5"/></svg>

    </header>
    <div class="tooltip" id="tooltip" role="tooltip"></div>
    <script type="module" src="./i18n.js?v=pocket-atlas"></script>
    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
    <script type="module">
      import * as THREE from 'three';
      import { antarcticaCoastline } from './antarctica-coastline.js';
      import { createTravelUI } from './travel-ui.js?v=pocket-atlas-brand';
      import { t, placeName, onLanguageChange } from './i18n.js?v=pocket-atlas';

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-8, 8, 6.5, 0, .1, 60);
      camera.position.set(0, 0, 20);
      camera.lookAt(0, 0, 0);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const canvas = renderer.domElement;
      canvas.tabIndex = 0;
      canvas.setAttribute('aria-label',t('canvas'));
      onLanguageChange(()=>canvas.setAttribute('aria-label',t('canvas')));
      document.body.prepend(canvas);
      scene.add(new THREE.HemisphereLight(0xfff7e4, 0x417e83, 2));
      const sun = new THREE.DirectionalLight(0xffebca, 3);
      sun.position.set(-7, 10, 12);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 9, bottom: -8, near: .5, far: 40 });
      sun.shadow.normalBias = .018;
      sun.shadow.bias = -.00008;
      scene.add(sun);
      const fill = new THREE.DirectionalLight(0xb9f0ed, .7);
      fill.position.set(7, 3, 5);
      scene.add(fill);
      const world = new THREE.Group();
      world.rotation.set(.13, -.04, -.08);
      scene.add(world);

      // Each ocean and land cell is an individual small brick, batched into two draw calls.
      const R = 5.15, ROWS = 108, COLUMNS = 216, ANCHOR = R + .255;
      const radians = THREE.MathUtils.degToRad;
      const regions = [
        [[-168,71],[-149,72],[-132,68],[-126,59],[-113,60],[-98,72],[-81,73],[-61,57],[-55,51],[-66,44],[-80,25],[-88,21],[-97,16],[-106,23],[-116,31],[-125,49],[-141,60],[-166,60]],
        [[-98,22],[-87,22],[-82,12],[-77,8],[-82,7],[-90,15]],
        [[-81,12],[-71,12],[-60,7],[-50,1],[-35,-6],[-40,-22],[-51,-30],[-65,-55],[-73,-52],[-76,-30],[-81,-5]],
        [[-53,60],[-42,60],[-20,75],[-27,83],[-49,83],[-62,76]],
        [[-17,36],[-5,36],[10,37],[24,32],[34,31],[43,12],[51,11],[43,-1],[40,-15],[32,-29],[19,-35],[11,-22],[9,-5],[-5,5],[-17,15]],
        [[-10,36],[-10,44],[-2,49],[8,54],[5,60],[19,71],[30,70],[30,59],[42,55],[42,42],[27,40],[22,35],[13,43],[4,43]],
        [[30,70],[60,74],[105,77],[140,72],[179,66],[179,54],[158,60],[146,47],[134,44],[127,34],[120,22],[110,20],[109,9],[103,1],[98,7],[96,20],[88,22],[80,7],[73,18],[67,25],[58,24],[50,13],[43,14],[35,31],[28,40],[42,50]],
        [[112,-11],[132,-11],[140,-16],[151,-24],[153,-37],[137,-39],[127,-32],[114,-35]],
        [[46,-13],[51,-16],[49,-25],[44,-26],[43,-18]],
        [[130,31],[134,34],[137,37],[141,40],[145,45],[142,46],[137,41],[133,35]],
        [[-9,50],[-3,50],[0,59],[-5,59]], [[-25,63],[-13,64],[-16,67],[-24,67]],
        [[95,5],[106,-5],[104,-7],[98,-2]], [[108,6],[118,6],[119,-3],[109,-4]],
        [[130,-2],[149,-5],[150,-10],[136,-8]], [[166,-34],[179,-39],[174,-47],[168,-46]],
      ];
      function inside(lon, lat, polygon) {
        let yes = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
          const [xi, yi] = polygon[i], [xj, yj] = polygon[j];
          if ((yi > lat) !== (yj > lat) && lon < (xj-xi)*(lat-yi)/(yj-yi)+xi) yes = !yes;
        }
        return yes;
      }
      const palettes = {
        sea: [0x348faa,0x439eb6,0x59b7c5,0x388ca9,0x69bdc8,0x4fa7b9],
        green: [0x78b54e,0x8ec55e,0x69a448,0xa2c968,0x599449],
        sand: [0xe5b955,0xf0c568,0xd6aa4a,0xf3d386],
        ice: [0xfff8e5,0xf1eedc,0xdde9df],
      };
      // Stylized river courses, expressed as longitude/latitude paths.
      const rivers = [
        [[96,33],[102,30],[109,30],[114,29],[119,31],[122,31]],
        [[31,30],[31,23],[33,17],[32,10],[33,3]],
        [[-75,-5],[-69,-4],[-62,-3],[-54,-2],[-49,-1]],
        [[-94,47],[-92,41],[-90,36],[-91,31],[-89,29]],
        [[84,31],[82,28],[86,26],[91,24]],
        [[29,57],[39,56],[47,52],[46,47]],
        [[23,-9],[27,-4],[22,1],[18,-1],[15,-5]],
      ];
      function pathDistance(lat, lon, path) {
        const stretch = Math.cos(radians(lat));
        let distance = Infinity;
        for (let i=1;i<path.length;i++) {
          const a=path[i-1], b=path[i];
          const dx=(b[0]-a[0])*stretch, dy=b[1]-a[1];
          const px=(lon-a[0])*stretch, py=lat-a[1];
          const t=THREE.MathUtils.clamp((px*dx+py*dy)/(dx*dx+dy*dy),0,1);
          distance=Math.min(distance,Math.hypot(px-t*dx,py-t*dy));
        }
        return distance;
      }
      function sample(lat, lon) {
        const antarctic = lat < -60 && antarcticaCoastline.some(rings=>
          inside(lon,lat,rings[0])&&!rings.slice(1).some(hole=>inside(lon,lat,hole)));
        const ice = lat > 77 || antarctic || inside(lon, lat, regions[3]);
        const land = ice || regions.some(p => inside(lon, lat, p));
        const sand = land && !ice && ((lat > 13 && lat < 32 && lon > -18 && lon < 64) || (lat < -18 && lat > -32 && lon > 115 && lon < 145));
        const river = land && !ice && rivers.some(path=>pathDistance(lat,lon,path)<1.15);
        return { land, ice, river, palette: river ? [0x328fa6,0x58b8c7,0x66c4cd] : ice ? palettes.ice : sand ? palettes.sand : land ? palettes.green : palettes.sea };
      }
      const cells = [];
      for (let row = 0; row < ROWS; row++) {
        const lat = -90 + (row + .5) * 180 / ROWS;
        const count = Math.max(6, Math.round(COLUMNS * Math.cos(radians(lat))));
        for (let col = 0; col < count; col++) {
          const lon = -180 + (col + .5) * 360 / count;
          cells.push({ lat, lon, width: 2*Math.PI*R*Math.cos(radians(lat))/count, ...sample(lat,lon) });
        }
      }
      const surfaceMaterial = new THREE.MeshStandardMaterial({ roughness: .69, metalness: 0 });
      const blocks = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), surfaceMaterial, cells.length);
      const studs = new THREE.InstancedMesh(new THREE.CylinderGeometry(.040,.042,.032,12), surfaceMaterial, cells.length);
      blocks.castShadow = blocks.receiveShadow = true;
      studs.castShadow = studs.receiveShadow = true;
      const dummy = new THREE.Object3D(), basis = new THREE.Matrix4();
      const up = new THREE.Vector3(), east = new THREE.Vector3(), south = new THREE.Vector3();
      const color = new THREE.Color();
      function orient(group, lat, lon, radius) {
        up.setFromSphericalCoords(1, radians(90-lat), radians(lon));
        east.set(Math.cos(radians(lon)), 0, -Math.sin(radians(lon)));
        south.crossVectors(east, up).normalize();
        basis.makeBasis(east, up, south);
        group.quaternion.setFromRotationMatrix(basis);
        group.position.copy(up).multiplyScalar(radius);
        return group;
      }
      cells.forEach((cell, index) => {
        const seed = Math.sin(index * 127.1 + 311.7) * 43758.5453;
        const noise = seed - Math.floor(seed);
        const height = cell.river ? .12 : cell.land ? .145 + Math.floor(noise*3)*.025 : .075 + Math.floor(noise*3)*.014;
        cell.height=height;
        cell.normal=new THREE.Vector3().setFromSphericalCoords(1,radians(90-cell.lat),radians(cell.lon));
        orient(dummy, cell.lat, cell.lon, R + height/2);
        dummy.scale.set(cell.width*.97, height, Math.PI*R/ROWS*.97);
        dummy.updateMatrix();
        blocks.setMatrixAt(index, dummy.matrix);
        color.setHex(cell.palette[Math.floor(noise*cell.palette.length)]);
        blocks.setColorAt(index, color);
        orient(dummy, cell.lat, cell.lon, R + height + .016);
        dummy.scale.set(1,1,1);
        dummy.updateMatrix();
        studs.setMatrixAt(index, dummy.matrix);
        studs.setColorAt(index, color);
      });
      world.add(blocks, studs);
      const core = new THREE.Mesh(new THREE.SphereGeometry(R-.025,96,64), new THREE.MeshStandardMaterial({color:0x367e91,roughness:.85}));
      world.add(core);
      canvas.dataset.brickCount = String(cells.length);

      // Extend the existing spherical grid up to the underside of each load-bearing plate.
      // The dot product solves the radial distance to a tangent plane, including its curved edges.
      let foundationCells=0;
      const foundationInverse=new THREE.Quaternion(), localCell=new THREE.Vector3();
      function fitFoundation(group,halfWidth,halfDepth,bottomY,contacts=null,groundColor=null) {
        foundationInverse.copy(group.quaternion).invert();
        const normal=group.position.clone().normalize();
        const planeDistance=group.position.length()+bottomY;
        for(let i=0;i<cells.length;i++) {
          const cell=cells[i],alignment=cell.normal.dot(normal);
          if(alignment<.97)continue;
          const radius=planeDistance/alignment;
          localCell.copy(cell.normal).multiplyScalar(radius).sub(group.position).applyQuaternion(foundationInverse);
          // Include cells intersecting a plate edge, so no corner is left unsupported.
          const margin=cell.width*.52;
          if(Math.abs(localCell.x)>halfWidth+margin || Math.abs(localCell.z)>halfDepth+margin)continue;
          const touches=(box,padding)=>localCell.x>=box.min.x-padding && localCell.x<=box.max.x+padding &&
            localCell.z>=box.min.z-padding && localCell.z<=box.max.z+padding;
          if(contacts && !contacts.some(box=>touches(box,margin)))continue;
          const height=Math.max(cell.height,radius-R+.009);
          orient(dummy,cell.lat,cell.lon,R+height/2);
          dummy.scale.set(cell.width*.985,height,Math.PI*R/ROWS*.985);
          dummy.updateMatrix();blocks.setMatrixAt(i,dummy.matrix);
          if(groundColor!==null || !contacts || !cell.land)blocks.setColorAt(i,new THREE.Color(groundColor??(cell.ice?0xe2e7d7:0x85ad61)));
          cell.height=height;
          // Covered studs must not poke through buildings or make them appear to balance on bumps.
          orient(dummy,cell.lat,cell.lon,R+height+.016);
          const covered=contacts?contacts.some(box=>touches(box,.045)):
            Math.abs(localCell.x)<halfWidth+margin*.25 && Math.abs(localCell.z)<halfDepth+margin*.25;
          dummy.scale.setScalar(covered?0:1);
          dummy.updateMatrix();studs.setMatrixAt(i,dummy.matrix);
          if(groundColor!==null || !contacts || !cell.land)studs.setColorAt(i,new THREE.Color(groundColor??(cell.ice?0xe2e7d7:0x85ad61)));
          foundationCells++;
        }
      }

      const materials = {};
      function material(hex) {
        return materials[hex] ||= new THREE.MeshStandardMaterial({ color:hex, roughness:.65 });
      }
      const boxGeometry = new THREE.BoxGeometry(1,1,1);
      const studGeometry = new THREE.CylinderGeometry(.045,.048,.035,10);
      function brick(parent,x,y,z,w,h,d,hex,withStuds=false) {
        const piece = new THREE.Group();
        piece.position.set(x,y,z);
        piece.userData.isBrick = true;
        const mesh = new THREE.Mesh(boxGeometry,material(hex));
        mesh.scale.set(w,h,d);
        mesh.castShadow = mesh.receiveShadow = true;
        piece.add(mesh); parent.add(piece);
        if (withStuds) {
          const nx = Math.max(1,Math.round(w/.17)), nz = Math.max(1,Math.round(d/.17));
          for(let ix=0;ix<nx;ix++) for(let iz=0;iz<nz;iz++) {
            const stud = new THREE.Mesh(studGeometry,material(hex));
            stud.position.set((ix-(nx-1)/2)*w/nx,h/2+.018,(iz-(nz-1)/2)*d/nz);
            stud.castShadow=true; piece.add(stud);
          }
        }
        return piece;
      }
      function tree(parent,x,z,size=.8) {
        const tree = new THREE.Group();
        tree.position.set(x,0,z); tree.scale.setScalar(size); parent.add(tree);
        brick(tree,0,.15,0,.055,.3,.055,0x80583e);
        for(let i=0;i<4;i++) brick(tree,0,.28+i*.095,0,.33-i*.07,.085,.33-i*.07, i%2?0x438853:0x367b51,true);
      }
      const landmarks = [], landmarkHitboxes = [];
      // Geographic coordinates remain separate from gently separated display positions.
      // Country entries group nearby cities while keeping separate photo albums.
      const destinations = [
        {id:'paris',name:'巴黎',lat:48.86,lon:2.29,type:'tower',width:.92,depth:.76,cities:['巴黎']},
        {id:'japan',name:'日本',lat:35.66,lon:139.745,type:'tokyo-tower',width:1.10,depth:.95,cities:['东京','大阪']},
        {id:'new-york',name:'纽约',lat:40.69,lon:-74.04,type:'statue',width:1.0,depth:.82,cities:['纽约']},
        {id:'cairo',name:'开罗',lat:29.98,lon:31.13,type:'pyramid',width:1.10,depth:.95,cities:['开罗']},
        {id:'shanghai',name:'上海',lat:31.24,lon:121.50,type:'shanghai',width:1.10,depth:.95,cities:['上海']},
        {id:'jeju',name:'济州岛',lat:33.36,lon:126.53,type:'jeju',width:.72,depth:.65,cities:['济州岛']},
        {id:'barcelona',name:'巴塞罗那',lat:41.40,lon:2.17,type:'barcelona',width:.88,depth:.76,cities:['巴塞罗那']},
        {id:'iceland',name:'冰岛',lat:64.15,lon:-21.94,type:'iceland',width:.86,depth:.72,cities:['冰岛']},
        {id:'united-kingdom',name:'英国',lat:54.6,lon:-3.4,type:'britain',width:.92,depth:.78,cities:['伦敦','爱丁堡']},
        {id:'singapore',name:'新加坡',lat:1.28,lon:103.86,type:'singapore',width:1.15,depth:1.25,cities:['新加坡']},
        {id:'maldives',name:'马尔代夫',lat:4.17,lon:73.51,type:'maldives',width:1.18,depth:.95,cities:['马尔代夫']},
      ];
      const visitedPlaces=new Set(['paris','japan','shanghai','jeju','barcelona','iceland','united-kingdom','singapore','maldives']);
      for(const place of destinations) {
        place.visited=visitedPlaces.has(place.id);
        place.anchor=new THREE.Vector3().setFromSphericalCoords(1,radians(90-place.lat),radians(place.lon));
        place.display=place.anchor.clone();
        place.footprint=Math.hypot(place.width,place.depth)/2;
      }
      for(let iteration=0;iteration<160;iteration++) {
        let maximumOverlap=0;
        for(let i=0;i<destinations.length;i++)for(let j=i+1;j<destinations.length;j++) {
          const a=destinations[i],b=destinations[j];
          const separation=a.display.distanceTo(b.display)*ANCHOR;
          const required=a.footprint+b.footprint+.10;
          if(separation>=required)continue;
          const overlap=required-separation;maximumOverlap=Math.max(maximumOverlap,overlap);
          const direction=a.display.clone().sub(b.display).normalize();
          a.display.addScaledVector(direction,overlap/ANCHOR*.51).normalize();
          b.display.addScaledVector(direction,-overlap/ANCHOR*.51).normalize();
        }
        if(maximumOverlap<.001)break;
      }
      const landmarkLocations=destinations.map(place=>{
        // Seat each landmark on an actual terrain stud, with the same east/south axes.
        const cell=nearestTerrainCell(place.display);
        place.display.copy(cell.normal);
        place.displayLat=cell.lat;
        place.displayLon=cell.lon;
        return [place.displayLat,place.displayLon];
      });
      function nearestTerrainCell(direction) {
        let best=cells[0],alignment=-Infinity;
        for(const cell of cells) {
          const dot=cell.normal.dot(direction);
          if(dot>alignment){alignment=dot;best=cell;}
        }
        return best;
      }
      canvas.dataset.destinations=JSON.stringify(destinations.map(({id,name,lat,lon,displayLat,displayLon,cities,visited})=>({id,name,lat,lon,displayLat,displayLon,cities,visited})));
      const hitMaterial = new THREE.MeshBasicMaterial({visible:false});
      function landmark(place) {
        const {name,type,width,depth,displayLat:lat,displayLon:lon}=place;
        const g = new THREE.Group();
        function beam(a,b,w,hex) {
          const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b);
          const mid=start.clone().add(end).multiplyScalar(.5);
          const part=brick(g,mid.x,mid.y,mid.z,w,start.distanceTo(end),w,hex);
          part.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),end.sub(start).normalize());
          return part;
        }
        if(type==='tower') {
          const bronze=0x9c6749,highlight=0xc99762;
          const levels=[.09,.20,.31,.42,.53,.64,.75,.86,.97,1.08,1.19,1.29];
          const spreads=[.245,.217,.182,.15,.125,.103,.086,.07,.056,.044,.031,.023];
          for(let i=0;i<levels.length-1;i++) {
            const y=levels[i],nextY=levels[i+1],s=spreads[i],n=spreads[i+1];
            for(const x of [-1,1])for(const z of [-1,1])beam([x*s,y,z*s],[x*n,nextY,z*n],.026,bronze);
            // Cross-bracing on all four faces, with open archways at the base.
            if(i>1)for(const side of [-1,1]) {
              beam([-s,y,side*s],[n,nextY,side*n],.013,highlight);
              beam([s,y,side*s],[-n,nextY,side*n],.013,bronze);
              beam([side*s,y,-s],[side*n,nextY,n],.013,highlight);
              beam([side*s,y,s],[side*n,nextY,-n],.013,bronze);

      [[55,-116],[44,-102],[-10,-63],[-23,-52],[57,28],[61,73],[49,108],[27,104],[-25,144],[-8,25]]

      // Small tree clusters between settlements keep the landscape varied without filling every tile.

      scenery.updateMatrixWorld(true);
      const batches=new Map();

        items.forEach((item,i)=>{instances.setMatrixAt(i,item.matrix);instances.setColorAt(i,item.color);});

      canvas.dataset.scenery=JSON.stringify({towns:townCount,buildings:buildingCount,mountainPeaks:peaks.length,rivers:rivers.length});
      blocks.instanceMatrix.needsUpdate=studs.instanceMatrix.needsUpdate=true;
      blocks.instanceColor.needsUpdate=studs.instanceColor.needsUpdate=true;
      blocks.computeBoundingSphere();studs.computeBoundingSphere();

      let selectedLandmark=null,focusTween=null,savedOverview=null,overviewHeight=0;
      const focusPoint=new THREE.Vector3();
      // Overview keeps the globe's center at the bottom edge; detail framing reserves space for UI.

        const frameTop=ANCHOR+2.05;

        const touchScreen=matchMedia('(pointer: coarse)').matches;
        const phone=width<=700 || (touchScreen && Math.min(width,height)<=700);
        const tablet=touchScreen && Math.min(width,height)<=1024;
        const phonePortrait=phone && height>width;
        const framingZoom=phone?1.65:tablet?1.25:1.04;

          ? Math.min(height*.60/R,availableHeight/ANCHOR)
          : Math.min(width/(frameHalfWidth*2)*framingZoom,availableHeight/frameTop*1.04);

        overviewHeight=viewHeight;
        if(!selectedLandmark && !focusTween) {

          camera.top=viewHeight; camera.bottom=0;
          camera.updateProjectionMatrix();
        }

      resize(); addEventListener('resize',resize);
      const ray=new THREE.Raycaster(), pointer=new THREE.Vector2(10,10);
      const tooltip=document.querySelector('#tooltip');
      const solidSphere=new THREE.Sphere(new THREE.Vector3(),R+.06);
      const occlusionPoint=new THREE.Vector3();
      let hover=null, dragging=false, pointerId=null, previousX=0,previousY=0,downX=0,downY=0,pressTravel=0,pressedLandmark=null;
      const velocity=new THREE.Vector2(), turn=new THREE.Quaternion();
      const axisX=new THREE.Vector3(1,0,0),axisY=new THREE.Vector3(0,1,0);
      const travelUI=createTravelUI({destinations,onSelect:focusDestination,onClose:closeDestination});
      function focusDestination(id) {
        const g=landmarks.find(item=>item.userData.id===id&&item.userData.visited);
        if(!g || (g===selectedLandmark&&!focusTween))return;
        if(!savedOverview)savedOverview=world.quaternion.clone();
        if(g!==hover&&g!==selectedLandmark)randomizeScatter(g);
        selectedLandmark=g;velocity.set(0,0);pointer.set(10,10);

        const rotation=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(east,normal,south))

      function updateFocus(time,dt) {

        tooltip.style.display=hover?'block':'none';
